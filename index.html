<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Char Lang | Academic Homepage</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body { font-family: "Figtree", sans-serif; background-color: #f8f9fa; color: #212529; }
        .navbar { background-color: #ffffff; border-bottom: 1px solid #e9ecef; }
        .navbar-brand .navbar-item { font-weight: 700; font-size: 1.25rem; color: #212529; }
        .navbar-menu.is-active { display: block !important; position: absolute; left: 0; right: 0; top: 100%; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 1rem; }
        .hero { background: #ffffff; border-bottom: 1px solid #e9ecef; margin-bottom: 3rem; }
        .content p { font-size: 1.1rem; color: #495057; line-height: 1.7; margin-bottom: 1.5rem; }
        footer { background: #ffffff; border-top: 1px solid #e9ecef; padding: 2rem 0; margin-top: 4rem; color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item" href="https://charphd.com">LANG</a>
                <a role="button" class="navbar-burger" id="mobile-burger-btn" aria-label="menu" aria-expanded="false">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>
            <div class="navbar-menu" id="mobile-nav-menu">
                <div class="navbar-end">
                    <a class="navbar-item" href="https://charphd.com">About</a>
                    <a class="navbar-item" href="research.html">Research</a>
                    <a class="navbar-item" href="teaching.html">Teaching</a>
                    <a class="navbar-item" href="cv.html">CV</a>
                    <a class="navbar-item" href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </nav>
    <section class="section" style="margin-top: 4rem;">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-8">
                    <h1 class="title is-2">About</h1>
                    <div class="content">
                        <p>Welcome to my academic homepage! My name is Char Lang...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="content has-text-centered">
            <p>&copy; 2026 LANG &middot; Hosted via GitHub Pages</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const burger = document.getElementById('mobile-burger-btn');
            const menu = document.getElementById('mobile-nav-menu');
            if (burger && menu) {
                burger.addEventListener('click', () => {
                    burger.classList.toggle('is-active');
                    menu.classList.toggle('is-active');
                });
            }
        });
    </script>
</body>
</html>
